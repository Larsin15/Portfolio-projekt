<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BARF Meal Calculator for Cats</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f3f4f6;
        padding: 2rem;
        color: #1f2937;
      }
      .container {
        max-width: 700px;
        margin: 0 auto;
        background-color: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      label,
      select,
      input,
      button {
        display: block;
        width: 100%;
        margin-bottom: 1rem;
        padding: 0.5rem;
      }
      button {
        background-color: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        border-radius: 8px;
      }
      pre {
        background: #e5e7eb;
        padding: 1rem;
        border-radius: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>BARF Meal Calculator</h2>

      <label for="weight">Cat Weight (kg):</label>
      <input type="number" id="weight" value="5.2" step="0.1" min="1" />

      <label for="percent">Feeding Percentage (2–4% of body weight):</label>
      <input type="number" id="percent" value="3" step="0.1" min="2" max="4" />

      <label for="neutered">Is your cat neutered/spayed?</label>
      <select id="neutered">
        <option value="no">No</option>
        <option value="yes-zoomies">Yes, active (20% reduction)</option>
        <option value="yes-lazy">Yes, calm (30% reduction)</option>
      </select>

      <label for="dryFood">Dry food given per day (grams):</label>
      <input type="number" id="dryFood" value="25" step="1" min="0" />

      <label for="days">How many days to prepare BARF for:</label>
      <input type="number" id="days" value="30" min="1" />

      <label for="recipe">Select Recipe:</label>
      <select id="recipe">
        <option value="original">Your Original BARF Recipe</option>
        <option value="feline_nutrition">Feline Nutrition Recipe</option>
      </select>

      <div id="stockInputs"></div>

      <button onclick="calculateBARF()">Calculate</button>

      <pre id="output"></pre>
    </div>

    <script>
      const recipes = {
        original: {
          basePortions: 45,
          ingredients: {
            "Ground rose hip (tbsp)": 6,
            "Fish oil (tsp)": 2,
            "Vitamin E (kryddmått)": 7,
            "Chicken liver (g)": 300,
            "Chicken stomach (g)": 450,
            "Chicken heart (g)": 600,
            "Minced chicken wing (g)": 700,
            "Minced beef (g)": 1000,
            "Minced lamb (g)": 500,
          },
        },
        feline_nutrition: {
          basePortions: 35,
          ingredients: {
            "Chicken thighs with bone (g)": 2000,
            "Chicken liver (g)": 200,
            "Chicken hearts (g)": 400,
            "Egg yolks": 4,
            "Water (ml)": 240,
            "Taurine (mg)": 2000,
            "Fish oil (mg)": 4000,
            "Vitamin E (IU)": 200,
            "Vitamin B-complex (mg)": 200,
            "Iodized salt (ml)": 7.5,
            "Psyllium husk (ml)": 20,
          },
        },
      };

      document
        .getElementById("recipe")
        .addEventListener("change", renderStockInputs);
      window.onload = renderStockInputs;

      function renderStockInputs() {
        const recipeKey = document.getElementById("recipe").value;
        const ingredients = recipes[recipeKey].ingredients;
        const stockDiv = document.getElementById("stockInputs");
        stockDiv.innerHTML = "<h3>Enter Your Ingredient Stock (Optional)</h3>";
        for (const key in ingredients) {
          stockDiv.innerHTML += `
          <label for="stock-${key}">${key} in stock:</label>
          <input type="number" id="stock-${key}" step="0.01" min="0" value="0">
        `;
        }
      }

      function calculateBARF() {
        const weight = parseFloat(document.getElementById("weight").value);
        const percent =
          parseFloat(document.getElementById("percent").value) / 100;
        const neutered = document.getElementById("neutered").value;
        const dryFood = parseFloat(document.getElementById("dryFood").value);
        const days = parseInt(document.getElementById("days").value);
        const recipeKey = document.getElementById("recipe").value;
        const recipe = recipes[recipeKey];

        let reductionFactor = 1;
        if (neutered === "yes-zoomies") reductionFactor = 0.8;
        else if (neutered === "yes-lazy") reductionFactor = 0.7;

        const adjustedDailyIntake = weight * 1000 * percent * reductionFactor;
        const barfNeededPerDay = Math.max(adjustedDailyIntake - dryFood, 0);
        const totalBARFNeeded = barfNeededPerDay * days;
        const portionSize = totalBARFNeeded / days;

        const portionCount = Math.ceil(totalBARFNeeded / portionSize);

        const outputDiv = document.getElementById("output");
        let output = `Cat weight: ${weight}kg\n`;
        output += `Feeding at: ${(percent * 100).toFixed(1)}% of body weight\n`;
        output += `Neutering adjustment: ${Math.round(
          (1 - reductionFactor) * 100
        )}%\n`;
        output += `Daily dry food: ${dryFood}g\n`;
        output += `BARF needed daily: ${barfNeededPerDay.toFixed(1)}g\n`;
        output += `Total BARF for ${days} days: ${totalBARFNeeded.toFixed(
          1
        )}g\n\n`;

        output += `Ingredients needed for ${days} days of BARF:\n\n`;

        for (const [ingredient, totalAmount] of Object.entries(
          recipe.ingredients
        )) {
          const perPortion = totalAmount / recipe.basePortions;
          const perGram = perPortion / portionSize;
          const totalNeeded = perGram * totalBARFNeeded;
          const stockEl = document.getElementById(`stock-${ingredient}`);
          const stock = stockEl ? parseFloat(stockEl.value) : 0;
          const toBuy = Math.max(totalNeeded - stock, 0);
          const leftover = Math.max(stock - totalNeeded, 0);

          output +=
            `- ${ingredient}: per g of BARF: ${perGram.toFixed(
              4
            )}, Total needed: ${totalNeeded.toFixed(2)}, ` +
            `In stock: ${stock}, To buy: ${toBuy.toFixed(
              2
            )}, Leftover: ${leftover.toFixed(2)}\n`;
        }

        outputDiv.textContent = output;
      }
    </script>
  </body>
</html>
